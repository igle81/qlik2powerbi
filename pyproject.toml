[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qlik-to-powerbi"
version = "12.0.0"
description = "Convierte un script y una exportación de Qlik en un proyecto Power BI (PBIP). El código heredado no tiene licencia publicada: ver README."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
]

[project.optional-dependencies]
azure = [
    "azure-identity>=1.14",
    "azure-core>=1.29",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]
all = ["qlik-to-powerbi[azure,dev]"]

[project.scripts]
qlik2pbi = "qlik2pbi.cli:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["fabric_api*", "qlik_export*", "powerbi_import*", "qlik2pbi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
